[package]
name = "livox_mid360"
version = "0.1.0"
edition = "2024"
authors = ["Juan David Guevara Arévalo <soyjuandavidguevara@gmail.com>"]
license = "Apache-2.0"
description = "Livox MID360 communication, packet parsing, and optional cloud/encode/IMU helpers"

[features]
default = []
cloud = ["dep:glam"]
encode = []
imu = ["dep:glam"]

[dependencies]
if-addrs = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tracing = "0.1"
glam = { version = "0.29", optional = true }

[dev-dependencies]
tokio-test = "0.4"
