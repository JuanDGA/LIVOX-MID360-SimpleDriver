[package]
name = "lidar_reader"
version = "0.1.0"
edition = "2024"
authors = ["Juan David Guevara Arévalo <soyjuandavidguevara@gmail.com>"]
license = "Apache-2.0"

[features]
default = []
# Enables the `lidar_viewer` binary (3D point-cloud window).
viewer = ["dep:minifb", "dep:glam"]

[dependencies]
if-addrs = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "full"] }
tracing = "0.1"
glam = { version = "0.29", optional = true }
minifb = { version = "0.27", optional = true }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
bytemuck = "1.25.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "lidar_reader"
path = "src/main.rs"

[[bin]]
name = "lidar_viewer"
path = "src/bin/lidar_viewer.rs"
required-features = ["viewer"]
